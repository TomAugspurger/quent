[package]
name = "quent-codegen-python-test-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "quent_codegen_test"
crate-type = ["cdylib"]
test = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
quent-dynamic-attributes = { path = "../../../../../../crates/dynamic-attributes" }
quent-instrumentation = { path = "../../../../../../crates/instrumentation", features = ["serde", "io-ndjson"] }
quent-io = { path = "../../../../../../crates/io", default-features = false, features = ["ndjson"] }
quent-readme-example = { path = "../../../../../../examples/readme" }

[build-dependencies]
quent-schema-codegen-python = { path = "../.." }
quent-yaml = { path = "../../../../../../crates/yaml" }
